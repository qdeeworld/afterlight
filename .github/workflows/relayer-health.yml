name: Production judged-path health

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afterlight-relayer-health
  cancel-in-progress: true

jobs:
  health:
    name: Verify judged path, submission, and privacy boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check HTTPS health and security boundary
        env:
          HEALTH_URL: https://afterlight-relayer-phase-a.qdworld001.workers.dev/health
          APP_URL: https://afterlight.dolepee.com
        run: |
          set -euo pipefail
          evidence_dir="$(mktemp -d)"
          healthy=0
          for attempt in 1 2 3; do
            if curl \
              --fail-with-body \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --header "Origin: $APP_URL" \
              --dump-header "$evidence_dir/headers" \
              --output "$evidence_dir/body.json" \
              "$HEALTH_URL" && jq -e '
            .status == "ok" and
            .service == "afterlight-neutral-relayer" and
            .schema == "afterlight-relay/1" and
            .submission == "enabled" and
            .executor.configurationReady == true and
            .executor.signerAdapterAvailable == true and
            .executor.executable == true and
            .balance.status == "ok" and
            .balance.alert == false and
            .claimCapacity.status == "ready" and
            .claimCapacity.fundingStatus == "ready" and
            .privacy.payloadLogging == false and
            .privacy.appKeysHeld == false and
            .privacy.walletAddressesRequired == false
              ' "$evidence_dir/body.json" > /dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep "$attempt"
          done
          test "$healthy" -eq 1

          grep -Eiq '^cache-control: no-store' "$evidence_dir/headers"
          grep -Eiq "^access-control-allow-origin: $APP_URL" "$evidence_dir/headers"
          grep -Eiq '^vary: Origin' "$evidence_dir/headers"
          grep -Eiq '^content-security-policy:.*default-src .none.' "$evidence_dir/headers"
          grep -Eiq '^x-content-type-options: nosniff' "$evidence_dir/headers"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 20 \
            --output "$evidence_dir/app.html" \
            "$APP_URL"
          grep -Fq '<title>Afterlight' "$evidence_dir/app.html"
