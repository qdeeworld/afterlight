name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cairo:
    name: Cairo contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep git dependency checkouts isolated from setup-action cache restores.
      SCARB_CACHE: /tmp/afterlight-scarb-cache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Scarb
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        with:
          scarb-version: 2.18.0
          scarb-lock: Scarb.lock

      - name: Set up Starknet Foundry
        uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        with:
          starknet-foundry-version: 0.62.1

      - name: Fetch Cairo dependencies with bounded retry
        run: |
          for attempt in 1 2 3; do
            if scarb fetch; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Build contracts from the resolved cache
        env:
          SCARB_OFFLINE: "true"
        run: scarb build

      - name: Build the locked deployment profile
        env:
          SCARB_OFFLINE: "true"
        run: scarb --profile spike-inline-56 build

      - name: Set up Node.js for artifact verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Verify exact deployment artifacts
        run: |
          npm --prefix client ci
          npm --prefix client run verify:locked-artifacts

      - name: Test contracts
        # snforge compiles its Rust-side test plugin on a fresh runner, so it
        # still needs crates.io even after Scarb's Cairo dependencies resolve.
        run: snforge test

  client:
    name: Client gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high

  relayer:
    name: Neutral relayer gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: relayer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: |
            relayer/package-lock.json
            client/package-lock.json

      - run: npm ci
      - name: Install shared client type dependencies
        run: npm --prefix ../client ci
      - run: npm run check
      - run: npm audit --audit-level=high

  web:
    name: Public product gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Install shared client type dependencies
        run: npm --prefix ../client ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
